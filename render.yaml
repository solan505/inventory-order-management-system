databases:
  - name: inventory-order-postgres
    databaseName: inventory_db
    user: inventory
    plan: free

services:
  - type: web
    name: inventory-order-api
    runtime: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: inventory-order-postgres
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: LOW_STOCK_THRESHOLD
        value: "5"
      - key: PORT
        value: "8000"
